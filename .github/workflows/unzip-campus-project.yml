name: One-time CampusHub ZIP extraction
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unzip-campus-project.yml'
permissions:
  contents: write
jobs:
  extract-and-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Extract project files over repository root
        shell: bash
        run: |
          set -euo pipefail
          test -f CampusHub-local-project.zip
          mkdir -p /tmp/campushub-archive
          unzip -q CampusHub-local-project.zip -d /tmp/campushub-archive
          test -d /tmp/campushub-archive/wniversity_management_system
          cp -a /tmp/campushub-archive/wniversity_management_system/. .
          rm -f CampusHub-local-project.zip
          rm -f .github/workflows/unzip-campus-project.yml
      - name: Commit extracted project files to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted changes to commit."
            exit 0
          fi
          git commit -m "Merge extracted CampusHub project files"
          git push origin HEAD:main
