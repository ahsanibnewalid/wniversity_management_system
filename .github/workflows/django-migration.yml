name: Django migration CI
on:
  push:
    branches: [django-migration]
  pull_request:
    branches: [main]
jobs:
  django-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: django_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m py_compile manage.py config/*.py legacy/*.py api/*.py
      - run: python manage.py check
