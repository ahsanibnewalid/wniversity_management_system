services:
  - type: web
    name: campushub
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m gunicorn backend.app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: campushub-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
databases:
  - name: campushub-db
    databaseName: campushub
    user: campushub
